name: Build and Push to ECR

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.ACCESS_KEY }} //from github actions secrets; secrets & variables->actions->repository
          aws-secret-access-key: ${{ secrets.SECRET_ACCESS_KEY }} //from github actions secrets; secrets & variables->actions->repository
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: gitops-k8s-repo
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          
      # The GitOps "Hand-off": Update the manifest repo with the new tag
      - name: Update Deployment Manifest
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          sed -i "s|image:.*|image: ${{ steps.login-ecr.outputs.registry }}/my-spring-boot-app:${{ github.sha }}|g" k8s/deployment.yaml
          git add k8s/deployment.yaml
          git commit -m "Update image tag to ${{ github.sha }}"
          git push
